name: Build & Release

on:
  # Manual trigger from the Actions tab — handy for testing.
  workflow_dispatch:
  # Auto-build on version tags (v2.0.1, v2.1.0, …).
  push:
    tags: ["v*"]

permissions:
  contents: write          # needed to create GitHub Releases

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Linux ─────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # --- System dependencies for Tauri 2 + PyInstaller ---
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf \
            libportaudio2 portaudio19-dev \
            ffmpeg xclip

      # --- Python + venv + PyInstaller backend ---
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller Novabackend.spec --noconfirm
          # Sanity check
          test -f dist/novatts-backend || { echo "::error::PyInstaller output missing"; exit 1; }

      # --- Node.js + npm ---
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'gui/package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # --- Tauri build ---
      # Do NOT use `npm run build:tauri` — that script adds
      # --config tauri.release.json which bundles .exe paths.
      # Running `tauri build` directly lets tauri.linux.conf.json
      # merge automatically and produce the right Linux bundle.
      - name: Build Tauri (AppImage + deb)
        run: npx tauri build --ci
        working-directory: gui

      # --- Upload ---
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: NovaTTS-Linux-AppImage
          path: gui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: NovaTTS-Linux-deb
          path: gui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  # ── Windows ───────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Build backend (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install -r requirements.txt
          pyinstaller Novabackend.spec --noconfirm
          if (-not (Test-Path dist\novatts-backend.exe)) {
            Write-Error "PyInstaller output missing"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'gui/package-lock.json') }}

      - name: Install npm dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            gui\src-tauri\target
          key: cargo-${{ runner.os }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Windows uses tauri.release.json (bundles .exe backend).
      - name: Build Tauri (NSIS installer)
        run: npx tauri build --ci --config src-tauri/tauri.release.json
        working-directory: gui

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: NovaTTS-Windows-Setup
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ── GitHub Release (only on version tags) ─────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/NovaTTS-Windows-Setup/*
            artifacts/NovaTTS-Linux-AppImage/*
            artifacts/NovaTTS-Linux-deb/*
