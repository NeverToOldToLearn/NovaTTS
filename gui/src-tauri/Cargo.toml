[package]
name = "novatts-gui"
version = "2.0.0"
description = "NovaTTS GUI"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

# Linux only: force the dark GTK variant for the native WebKitGTK widgets
# (the <select> popup is drawn by GTK, not by the page CSS).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lib]
name = "novatts_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
